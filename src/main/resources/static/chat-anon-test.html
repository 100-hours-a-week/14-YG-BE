<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>익명 채팅 테스트</h2>

<!-- 사용자 입력 폼 -->
<label>Post ID: <input id="postIdInput" type="number" value="10"/></label><br>
<label>Participant ID: <input id="participantIdInput" type="number" value="10"/></label><br>
<label>Message: <input id="messageInput" type="text" value="테스트 메시지입니다." size="50"/></label><br><br>

<!-- 연결 및 메시지 전송 버튼 -->
<button onclick="connect()">Connect</button>
<button onclick="sendMessage()">Send Message</button>

<h3>📩 수신된 메시지</h3>
<ul id="messageLog"></ul>

<script>
    let stompClient = null;  // STOMP 클라이언트 객체
    let postId = null;       // 현재 구독할 채팅방의 postId

    // WebSocket 연결 및 STOMP 구독 함수
    function connect() {
        postId = document.getElementById("postIdInput").value;

        const socket = new WebSocket("ws://localhost:8080/ws/chat");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, frame => {
            console.log('✅ 연결됨:', frame);

            // 서버로부터 메시지를 구독
            stompClient.subscribe(`/topic/chat-anon/${postId}`, message => {
                console.log('📩 수신됨 (raw STOMP message):', message);
                console.log('📩 수신된 본문:', message.body);

                try {
                    const msg = JSON.parse(message.body);
                    console.log('✅ 파싱된 메시지:', msg);

                    const item = document.createElement("li");
                    item.textContent =
                        `messageId: ${msg.messageId ?? '??'}\n` +
                        `postId: ${msg.postId ?? '??'}\n` +
                        `participantId: ${msg.participantId ?? '??'}\n` +
                        `messageContent: ${msg.messageContent ?? '??'}\n` +
                        `type: ${msg.type ?? '??'}\n` +
                        `createdAt: ${msg.createdAt ?? '??'}`;
                    document.getElementById("messageLog").appendChild(item);
                } catch (e) {
                    console.error('❌ JSON 파싱 실패:', e);
                }
            });

            console.log(`📡 구독 완료: /topic/chat-anon/${postId}`);
        }, error => {
            console.error('❌ 연결 실패:', error);
        });
    }

    // 메시지 전송 함수
    function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            alert("⚠️ 먼저 연결하세요.");
            return;
        }

        // 입력값 가져오기
        const postId = document.getElementById("postIdInput").value;
        const participantId = parseInt(document.getElementById("participantIdInput").value);
        const messageContent = document.getElementById("messageInput").value;

        // 전송할 메시지 객체 구성
        const payload = {
            postId: parseInt(postId),
            participantId: participantId,
            messageContent: messageContent
        };

        // 서버로 메시지 전송
        stompClient.send("/pub/api/chat-anon/message", {}, JSON.stringify(payload));
        console.log('🚀 전송됨:', payload);
    }
</script>
</body>
</html>
