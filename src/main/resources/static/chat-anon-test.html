<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>익명 채팅 테스트</h2>

<!-- 사용자 입력 폼 -->
<label>Post ID: <input id="postIdInput" type="number" value="10"/></label><br>
<label>Participant ID: <input id="participantIdInput" type="number" value="10"/></label><br>
<label>Message: <input id="messageInput" type="text" value="테스트 메시지입니다." size="50"/></label><br><br>

<!-- 연결 및 메시지 전송 버튼 -->
<button onclick="connect()">Connect</button>
<button onclick="sendMessage()">Send Message</button>

<h3>📩 수신된 메시지</h3>
<ul id="messageLog"></ul>

<script>
    let stompClient = null;

    function connect() {
        const postId = document.getElementById("postIdInput").value;
        const socket = new WebSocket("ws://localhost:8080/ws/chat");
        stompClient = Stomp.over(socket);

       stompClient.connect({}, () => {
           console.log("🟢 STOMP connected");
            stompClient.subscribe(`/topic/chat-anon/${postId}`, msg => {
                console.log("🟡 Subscribed to /topic/chat-anon/" + postId);
                try {
                    const m = JSON.parse(msg.body);
                    const item = document.createElement("li");
                    item.textContent =
                        `messageId: ${m.messageId}\n` +
                        `postId: ${m.postId}\n` +
                        `participantId: ${m.participantId}\n` +
                        `messageContent: ${m.messageContent}\n` +
                        `isSafe: ${m.isSafe}\n` +
                        `blurReason: ${m.blurReason}\n` +
                        `createdAt: ${m.createdAt}`;
                    document.getElementById("messageLog").appendChild(item);
                } catch (e) {
                    console.error('JSON parse error:', e);
                }
            });
        }, err => {
            console.error('Connection error:', err);
        });
    }

    function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            alert("⚠️ 먼저 연결하세요.");
            return;
        }

        const postId = parseInt(document.getElementById("postIdInput").value);
        const participantId = parseInt(document.getElementById("participantIdInput").value);
        const messageContent = document.getElementById("messageInput").value;

        const payload = { postId, participantId, messageContent };

        stompClient.send("/pub/chat-anon/message", {}, JSON.stringify(payload));
    }
</script>
</body>
</html>
